# Nginx reverse proxy configuration for Portfolio API
# Place this in /etc/nginx/conf.d/portfolio.conf or /etc/nginx/nginx.conf

user nginx;
worker_processes auto;
error_log /var/log/nginx/portfolio_error.log warn;
pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format portfolio_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/portfolio_access.log portfolio_json;
    error_log /var/log/nginx/portfolio_error.log warn;

    sendfile on;
    keepalive_timeout 65;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    # Required for Flask applications using itsdangerous tokens
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /;

    # 10MB client max body size to match Flask MAX_CONTENT_LENGTH
    client_max_body_size 10M;

    upstream portfolio_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name YOUR_DOMAIN.COM;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name YOUR_DOMAIN.COM;

        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API routes
        location /api/ {
            proxy_pass http://portfolio_api;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type $content_type;
            proxy_redirect off;
        }

        # Health check
        location /api/health {
            proxy_pass http://portfolio_api;
            access_log off;
        }

        # Static files (if any)
        location /static/ {
            alias /opt/portfolio/static/;
            expires 30d;
        }

        # All other requests
        location / {
            return 404;
        }
    }
}
