<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCC CIE — Admin Panel</title>
  <meta name="description" content="Admin panel for FCC CIE contact submissions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --surface: rgba(255,255,255,0.04);
      --surface2: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%);
      top: -200px; left: -200px;
      pointer-events: none;
    }

    /* ---- LOGIN PAGE ---- */
    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrapper { width: 100%; max-width: 400px; }

    .login-header { text-align: center; margin-bottom: 32px; }

    .shield-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle { color: var(--muted); font-size: 14px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 7px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input::placeholder { color: rgba(148,163,184,0.4); }

    input:focus {
      border-color: var(--accent);
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn-primary {
      width: 100%;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(99,102,241,0.45);
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-danger {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      padding: 7px 12px;
      font-size: 13px;
    }

    .btn-danger:hover { background: rgba(239,68,68,0.2); }

    .btn-ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .error-msg {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- DASHBOARD ---- */
    #dashboardPage { display: none; }

    .topbar {
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(16px);
    }

    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-logo { font-size: 18px; font-weight: 700; color: #a5b4fc; }
    .topbar-sub { font-size: 12px; color: var(--muted); }

    .main-content { padding: 32px 28px; max-width: 1100px; margin: 0 auto; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 700; color: #a5b4fc; }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title { font-size: 16px; font-weight: 600; }

    .submissions-list { display: flex; flex-direction: column; gap: 12px; }

    .submission-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      transition: border-color 0.2s;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .submission-card:hover { border-color: rgba(99,102,241,0.3); }

    .sub-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
    .sub-email { font-size: 13px; color: #a5b4fc; margin-bottom: 8px; }
    .sub-message { font-size: 14px; color: var(--muted); line-height: 1.5; }

    .sub-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    .badge-upload {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.25);
      color: #6ee7b7;
    }

    .badge-time {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .sub-actions { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .empty-text { font-size: 15px; }

    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .big-spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    .toast {
      position: fixed;
      top: 72px;
      right: 24px;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      z-index: 100;
      transform: translateX(200%);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }

    .toast.show { transform: translateX(0); }
    .toast.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

    @media (max-width: 600px) {
      .submission-card { flex-direction: column; }
      .sub-actions { flex-direction: row; align-items: center; width: 100%; }
      .main-content { padding: 20px 16px; }
      .topbar { padding: 0 16px; }
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-wrapper">
    <div class="login-header">
      <span class="shield-icon">🛡️</span>
      <h1>Admin Login</h1>
      <p class="subtitle">FCC CIE — Restricted Access</p>
    </div>
    <div class="card">
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter username" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">
          <span id="loginBtnText">Sign In</span>
        </button>
        <div class="error-msg" id="loginError"></div>
      </form>
    </div>
    <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted);">
      <a href="index.html" style="color:#a5b4fc;text-decoration:none;">← Back to contact form</a>
    </p>
  </div>
</div>

<!-- DASHBOARD PAGE -->
<div id="dashboardPage">
  <div class="topbar">
    <div class="topbar-left">
      <span style="font-size:20px;">🎓</span>
      <div>
        <div class="topbar-logo">FCC CIE</div>
        <div class="topbar-sub">Admin Panel</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn btn-ghost" id="refreshBtn" onclick="loadSubmissions()" style="padding:7px 14px;font-size:13px;">
        🔄 Refresh
      </button>
      <button class="btn btn-ghost" id="logoutBtn" style="padding:7px 14px;font-size:13px;">
        Sign Out
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Submissions</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">With Attachments</div>
        <div class="stat-value" id="statWithUpload">—</div>
      </div>
    </div>

    <div class="section-header">
      <div class="section-title">📬 Contact Submissions</div>
    </div>

    <div id="submissionsList" class="submissions-list">
      <div class="loading-state">
        <div class="big-spinner"></div>
        <div>Loading submissions...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const API = (window.API_BASE || 'https://fcc-cloud-project-11.onrender.com').replace(/\/$/, '');
  let authToken = null;

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
      + ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }

  // Login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';
    errEl.style.display = 'none';

    try {
      const res = await fetch(`${API}/api/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.message || 'Invalid credentials');

      authToken = data.token;
      sessionStorage.setItem('adminToken', authToken);

      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('dashboardPage').style.display = 'block';
      loadSubmissions();

    } catch (err) {
      errEl.textContent = '❌ ' + err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<span id="loginBtnText">Sign In</span>';
    }
  });

  // Logout
  document.getElementById('logoutBtn').addEventListener('click', () => {
    authToken = null;
    sessionStorage.removeItem('adminToken');
    document.getElementById('dashboardPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('loginForm').reset();
  });

  // Load submissions
  async function loadSubmissions() {
    const list = document.getElementById('submissionsList');
    list.innerHTML = '<div class="loading-state"><div class="big-spinner"></div><div>Loading...</div></div>';

    try {
      const res = await fetch(`${API}/api/admin/submissions`, {
        headers: { 'Authorization': `Bearer ${authToken}` },
      });

      if (res.status === 401) {
        showToast('Session expired. Please log in again.', 'error');
        document.getElementById('logoutBtn').click();
        return;
      }

      const data = await res.json();
      const submissions = data.submissions || [];

      document.getElementById('statTotal').textContent = submissions.length;
      document.getElementById('statWithUpload').textContent = submissions.filter(s => s.has_upload).length;

      if (submissions.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div class="empty-text">No submissions yet</div>
          </div>`;
        return;
      }

      list.innerHTML = submissions.map(s => `
        <div class="submission-card" id="sub-${s.id}">
          <div style="flex:1;min-width:0;">
            <div class="sub-name">${escHtml(s.name)}</div>
            <div class="sub-email">✉️ ${escHtml(s.email)}</div>
            <div class="sub-message">${escHtml(s.message)}</div>
            <div class="sub-meta">
              <span class="badge badge-time">🕐 ${formatDate(s.created_at)}</span>
              ${s.has_upload ? `<span class="badge badge-upload">📎 Has attachment</span>` : ''}
            </div>
          </div>
          <div class="sub-actions">
            <button class="btn btn-danger" onclick="deleteSubmission('${s.id}')">🗑️ Delete</button>
          </div>
        </div>
      `).join('');

    } catch (err) {
      list.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">${err.message}</div></div>`;
    }
  }

  // Delete submission
  async function deleteSubmission(id) {
    if (!confirm('Delete this submission? This cannot be undone.')) return;

    try {
      const res = await fetch(`${API}/api/admin/submissions/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${authToken}` },
      });

      if (!res.ok) {
        const d = await res.json();
        throw new Error(d.message || 'Delete failed');
      }

      const card = document.getElementById(`sub-${id}`);
      if (card) { card.style.opacity = '0'; card.style.transform = 'translateX(30px)'; card.style.transition = 'all 0.3s'; setTimeout(() => card.remove(), 300); }
      showToast('✅ Submission deleted');

      // Update stats
      const total = parseInt(document.getElementById('statTotal').textContent) - 1;
      document.getElementById('statTotal').textContent = total;

    } catch (err) {
      showToast('❌ ' + err.message, 'error');
    }
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Auto-restore session
  const saved = sessionStorage.getItem('adminToken');
  if (saved) {
    authToken = saved;
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboardPage').style.display = 'block';
    loadSubmissions();
  }
</script>
</body>
</html>
