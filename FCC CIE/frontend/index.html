<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <meta name="description" content="Get in touch. Send us a message or upload a document." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #10b981;
      --error: #ef4444;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6366f1, transparent);
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #8b5cf6, transparent);
      bottom: -100px; right: -100px;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #a5b4fc;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    .logo-badge span { font-size: 16px; }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input, textarea {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input::placeholder, textarea::placeholder { color: rgba(148,163,184,0.5); }

    input:focus, textarea:focus {
      border-color: var(--accent);
      background: rgba(99,102,241,0.08);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    textarea { resize: vertical; min-height: 120px; }

    /* File upload */
    .file-upload-area {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .file-upload-area:hover, .file-upload-area.drag-over {
      border-color: var(--accent);
      background: rgba(99,102,241,0.08);
    }

    .file-upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      padding: 0;
      border: none;
      background: none;
    }

    .upload-icon { font-size: 28px; margin-bottom: 8px; }
    .upload-text { font-size: 14px; color: var(--muted); }
    .upload-text strong { color: #a5b4fc; }
    .file-chosen { font-size: 13px; color: var(--success); margin-top: 8px; font-weight: 500; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(99,102,241,0.45);
    }

    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
      transform: translateX(200%);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 360px;
    }

    .toast.show { transform: translateX(0); }
    .toast.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }
    .toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .footer-link a {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-link a:hover { text-decoration: underline; }

    .success-state {
      text-align: center;
      padding: 20px 0;
      display: none;
    }

    .success-icon {
      font-size: 52px;
      margin-bottom: 16px;
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .success-state h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .success-state p { color: var(--muted); font-size: 15px; }

    .reset-btn {
      margin-top: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .reset-btn:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<div class="page-wrapper">
  <div class="header">
    <h1>Get in Touch</h1>
    <p class="subtitle">Send us a message or submit a document. We'll get back to you shortly.</p>
  </div>

  <div class="card">
    <!-- Form -->
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
      </div>

      <div class="form-group">
        <label>Attach PDF <span style="color:#64748b;font-size:11px;">(Optional, max 10MB)</span></label>
        <div class="file-upload-area" id="dropZone">
          <input type="file" id="pdfFile" name="pdfFile" accept=".pdf" aria-label="Upload PDF file" />
          <div class="upload-icon">📎</div>
          <div class="upload-text"><strong>Click to upload</strong> or drag & drop</div>
          <div class="upload-text" style="margin-top:4px;">PDF files only</div>
          <div class="file-chosen" id="fileChosen" style="display:none;"></div>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary">
        <span id="btnText">Send Message</span>
      </button>
    </form>

    <!-- Success State -->
    <div class="success-state" id="successState">
      <div class="success-icon">✅</div>
      <h2>Message Sent!</h2>
      <p>Thank you for reaching out. We'll get back to you soon.</p>
      <button class="btn reset-btn" id="resetBtn">Send Another Message</button>
    </div>
  </div>

  <div class="footer-link">
    Are you an admin? <a href="admin.html">Login here →</a>
  </div>
</div>

<script>
  const API = (window.API_BASE || 'https://fcc-cloud-project-11.onrender.com').replace(/\/$/, '');

  // Toast
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = (type === 'success' ? '✅ ' : '❌ ') + msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  // File upload UI
  const fileInput = document.getElementById('pdfFile');
  const fileChosen = document.getElementById('fileChosen');
  const dropZone = document.getElementById('dropZone');

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) {
      fileChosen.textContent = '📄 ' + fileInput.files[0].name;
      fileChosen.style.display = 'block';
    }
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.name.endsWith('.pdf')) {
      fileInput.files = e.dataTransfer.files;
      fileChosen.textContent = '📄 ' + file.name;
      fileChosen.style.display = 'block';
    } else {
      showToast('Only PDF files are allowed.', 'error');
    }
  });

  // Form submit
  document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    btn.disabled = true;
    btnText.innerHTML = '';
    btn.innerHTML = '<div class="spinner"></div> Sending...';

    try {
      let uploadKey = null, originalFilename = null;

      // Upload PDF first if selected
      if (fileInput.files[0]) {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        const upRes = await fetch(`${API}/api/upload-doc`, { method: 'POST', body: formData });
        const upData = await upRes.json();
        if (!upRes.ok) throw new Error(upData.message || 'File upload failed');
        uploadKey = upData.upload_key;
        originalFilename = upData.original_filename;
      }

      // Submit contact form
      const res = await fetch(`${API}/api/contact`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          message: document.getElementById('message').value.trim(),
          has_upload: !!uploadKey,
          upload_key: uploadKey,
          original_filename: originalFilename,
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Submission failed');

      document.getElementById('contactForm').style.display = 'none';
      document.getElementById('successState').style.display = 'block';

    } catch (err) {
      showToast(err.message || 'Something went wrong. Please try again.', 'error');
      btn.disabled = false;
      btn.innerHTML = '<span id="btnText">Send Message</span>';
    }
  });

  // Reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('contactForm').reset();
    fileChosen.style.display = 'none';
    document.getElementById('contactForm').style.display = 'block';
    document.getElementById('successState').style.display = 'none';
  });
</script>
</body>
</html>
